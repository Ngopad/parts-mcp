[project]
name = "parts-mcp"
version = "0.1.0"
description = "MCP-server til komponentsøgning (DigiKey m.fl.) for Vermillion-teamet"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.1",
    "httpx>=0.27",
]

[project.scripts]
parts-mcp = "parts_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
